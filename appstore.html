<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceRadar App Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #f9fafb; margin: 0; padding: 0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-enter { animation: slideUp 0.2s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans text-sm text-gray-800">
    <div id="root" class="w-full h-full"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const API = "https://api.priceradar.store";
        const DEALS_WORKER = "https://z.samz.de5.net/";
        const CURRENCY_SYMBOL = { USD: "$", CNY: "¥", HKD: "HK$", TWD: "NT$", JPY: "¥" };
        const ZERO_DECIMAL = { JPY: 1, KRW: 1, CLP: 1, IDR: 1, VND: 1 };
        
        // 確保轉換大寫以取得完整國家名稱
        function getRegionName(code) {
            if (!code) return "";
            const upperCode = code.toUpperCase();
            try {
                const regionName = new Intl.DisplayNames(['en'], { type: 'region' }).of(upperCode);
                return regionName || upperCode;
            } catch (e) {
                return upperCode;
            }
        }

        function toMajor(minorUnits, currency) {
            return ZERO_DECIMAL[currency] ? minorUnits : minorUnits / 100;
        }
        function formatPrice(value, currency) {
            const sym = CURRENCY_SYMBOL[currency] || currency + " ";
            const num = ZERO_DECIMAL[currency] ? Math.round(value) : value.toFixed(2);
            return sym + num;
        }
        function artworkUrl(url, size = 200) {
            return url ? url.replace("{w}x{h}{c}.{f}", `${size}x${size}bb.jpg`) : "";
        }

        function App() {
            const [mode, setMode] = useState('deals');
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [rates, setRates] = useState({});
            
            const [selectedApp, setSelectedApp] = useState(null);
            const [appDetails, setAppDetails] = useState(null);
            const [detailLoading, setDetailLoading] = useState(false);

            useEffect(() => {
                const initData = async () => {
                    setLoading(true);
                    try {
                        const [ratesRes, dealsRes] = await Promise.all([
                            fetch(`${API}/v1/rates`).catch(() => null),
                            fetch(DEALS_WORKER).catch(() => null)
                        ]);
                        
                        if (ratesRes && ratesRes.ok) {
                            const rateData = await ratesRes.json();
                            if (rateData.code === 0) setRates(rateData.data.rates);
                        }
                        
                        if (dealsRes && dealsRes.ok) {
                            const dealsData = await dealsRes.json();
                            const content = dealsData?.data?.appsOnSale?.content || [];
                            const formattedDeals = content
                                .filter(d => d.app?.ITunesId && d.app?.priceTier > 0)
                                .map(d => ({
                                    id: d.id,
                                    itunesId: d.app.ITunesId,
                                    name: d.app.title || "Unknown",
                                    developer: d.app.developer?.name || "",
                                    iconUrl: artworkUrl(d.app.artworkUrl),
                                    oldTier: d.priceTierFrom,
                                    isDeal: false
                                }));
                            setResults(formattedDeals);
                        }
                    } catch (e) {
                        console.error("Init error", e);
                    } finally {
                        setLoading(false);
                    }
                };
                initData();
            }, []);

            const handleSearch = async (e) => {
                e.preventDefault();
                const q = query.trim();
                if (!q) {
                    setMode('deals');
                    return; 
                }
                
                setMode('search');
                setLoading(true);
                try {
                    const res = await fetch(`${API}/v1/apps/search?q=${encodeURIComponent(q)}&store=apple_app_store&country=us`);
                    const data = await res.json();
                    if (data.code === 0) {
                        const formatted = data.data.map(d => ({
                            id: d.id,
                            name: d.name,
                            developer: d.developer,
                            iconUrl: d.icon_url,
                            storeAppId: d.store_app_id
                        }));
                        setResults(formatted);
                    }
                } catch (e) {
                    console.error("Search error", e);
                } finally {
                    setLoading(false);
                }
            };

            const openDetails = async (app) => {
                setSelectedApp(app);
                setDetailLoading(true);
                setAppDetails(null);
                
                try {
                    let prId = app.id;
                    if (app.isDeal && app.itunesId) {
                        const searchRes = await fetch(`${API}/v1/apps/search?q=${encodeURIComponent(app.name)}&store=apple_app_store&country=us`);
                        const searchData = await searchRes.json();
                        const matched = searchData.data?.find(d => String(d.store_app_id) === String(app.itunesId));
                        if (matched) prId = matched.id;
                    }

                    const [pricesRes, metaRes] = await Promise.all([
                        fetch(`${API}/v1/apps/${encodeURIComponent(prId)}/prices`),
                        fetch(`${API}/v1/apps/${encodeURIComponent(prId)}`)
                    ]);
                    
                    const pricesData = await pricesRes.json();
                    const metaData = await metaRes.json();
                    
                    setAppDetails({
                        ...app,
                        meta: metaData.code === 0 ? metaData.data : {},
                        plans: pricesData.code === 0 ? pricesData.data.plans : []
                    });

                } catch (e) {
                    console.error("Detail error", e);
                    setAppDetails({ error: "Failed to load prices." });
                } finally {
                    setDetailLoading(false);
                }
            };

            return (
                <div className="bg-white flex flex-col h-full w-full overflow-hidden relative">
                    {/* Header */}
                    <div className="bg-gray-100 px-4 py-3 flex items-center justify-between border-b border-gray-300 shrink-0 select-none w-full">
                        <div className="flex space-x-2">
                            <div className="w-3 h-3 rounded-full bg-red-400 shadow-inner"></div>
                            <div className="w-3 h-3 rounded-full bg-yellow-400 shadow-inner"></div>
                            <div className="w-3 h-3 rounded-full bg-green-400 shadow-inner"></div>
                        </div>
                        <div className="text-sm font-semibold text-gray-600">
                            {mode === 'deals' ? '🔥 Daily Paid Deals' : '🔍 Search Results'}
                        </div>
                        <div className="w-10"></div>
                    </div>

                    {/* Toolbar (滿版) */}
                    <div className="p-3 bg-gray-50 border-b border-gray-200 shrink-0 w-full">
                        <form onSubmit={handleSearch} className="flex gap-2 w-full">
                            <input 
                                type="text" 
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                placeholder="Search paid apps..."
                                className="flex-1 bg-white border border-gray-300 rounded-lg px-3 py-2 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow w-full"
                            />
                            <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors shrink-0">
                                Search
                            </button>
                        </form>
                    </div>

                    {/* Content List (滿版 Bar 格式，無左右留白) */}
                    <div className="flex-1 overflow-y-auto scrollbar-hide bg-white w-full">
                        {loading ? (
                            <div className="flex justify-center items-center h-40 text-blue-600 animate-pulse">Loading data...</div>
                        ) : (
                            <div className="flex flex-col w-full">
                                {results.map((app, idx) => (
                                    <div 
                                        key={idx} 
                                        onClick={() => openDetails(app)}
                                        className="bg-white hover:bg-gray-50 border-b border-gray-200 p-4 cursor-pointer transition-colors group flex items-center gap-4 w-full"
                                    >
                                        {app.iconUrl ? (
                                            <img src={app.iconUrl} className="w-12 h-12 rounded-xl border border-gray-100 object-cover shrink-0" alt="icon" />
                                        ) : (
                                            <div className="w-12 h-12 rounded-xl bg-gray-100 border border-gray-200 flex items-center justify-center text-lg font-bold text-gray-500 shrink-0">
                                                {app.name.charAt(0)}
                                            </div>
                                        )}
                                        <div className="flex-1 min-w-0 flex flex-col justify-center">
                                            <div className="font-semibold text-gray-800 truncate group-hover:text-blue-600 transition-colors">{app.name}</div>
                                            <div className="text-gray-500 text-xs truncate mt-0.5">{app.developer}</div>
                                        </div>
                                        <div className="shrink-0">
                                            <span className="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full text-xs font-medium border border-blue-200 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                                Compare ›
                                            </span>
                                        </div>
                                    </div>
                                ))}
                                {!results.length && !loading && (
                                    <div className="text-center text-gray-500 mt-10">No paid results found.</div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Detail Modal (全螢幕滿版，無背景遮罩與圓角) */}
                    {selectedApp && (
                        <div className="absolute inset-0 z-50 bg-white flex flex-col modal-enter overflow-hidden w-full h-full">
                            <div className="flex justify-between items-center p-4 border-b border-gray-200 bg-gray-50 shrink-0 w-full">
                                <div className="flex items-center gap-3">
                                    <img src={selectedApp.iconUrl} className="w-10 h-10 rounded-xl border border-gray-200 shrink-0" alt="" />
                                    <div className="flex-1 min-w-0 pr-4">
                                        <h3 className="font-bold text-base text-gray-800 truncate">{selectedApp.name}</h3>
                                        <p className="text-xs text-gray-500 truncate">{selectedApp.developer}</p>
                                    </div>
                                </div>
                                <button onClick={() => setSelectedApp(null)} className="p-2 bg-gray-200/50 hover:bg-gray-300 rounded-full text-gray-600 transition-colors shrink-0">
                                    ✕
                                </button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto bg-white p-0 w-full">
                                {detailLoading ? (
                                    <div className="text-center text-gray-500 animate-pulse py-10">Fetching global prices...</div>
                                ) : appDetails?.error ? (
                                    <div className="text-red-500 text-center py-10">{appDetails.error}</div>
                                ) : (
                                    <div className="flex flex-col w-full pb-8">
                                        {appDetails?.meta?.store_url && (
                                            <div className="flex justify-end p-4 border-b border-gray-100 bg-white w-full">
                                                <a href={appDetails.meta.store_url} target="_blank" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                                    Open in App Store ↗
                                                </a>
                                            </div>
                                        )}

                                        {!appDetails?.plans || appDetails.plans.length === 0 ? (
                                            <div className="p-6 text-center text-gray-500 w-full">
                                                No paid subscription plans available.
                                            </div>
                                        ) : (
                                            appDetails.plans.filter(p => p.prices?.length > 0).map((plan, idx) => {
                                                const validPrices = plan.prices.filter(p => rates[p.currency] && rates['HKD']);
                                                const sortedPrices = validPrices.map(p => {
                                                    const major = toMajor(p.price, p.currency);
                                                    const hkdValue = (major / rates[p.currency]) * rates['HKD'];
                                                    return {
                                                        regionCode: p.region_code,
                                                        regionName: getRegionName(p.region_code),
                                                        original: formatPrice(major, p.currency),
                                                        hkd: hkdValue
                                                    };
                                                }).filter(p => p.hkd > 0)
                                                  .sort((a, b) => a.hkd - b.hkd);

                                                const lowest = sortedPrices[0];

                                                if (!sortedPrices.length) return null;

                                                return (
                                                    <div key={idx} className="bg-white border-b-8 border-gray-100 overflow-hidden w-full">
                                                        <div className="bg-gray-50 px-4 py-3 border-y border-gray-200 flex justify-between items-center w-full">
                                                            <span className="font-bold text-gray-800">{plan.name || plan.kind || 'Subscription'}</span>
                                                            <span className="text-xs text-gray-500 uppercase">{plan.billing_period || 'One-time'}</span>
                                                        </div>
                                                        
                                                        {lowest && (
                                                            <div className="p-4 bg-green-50/50 border-b border-gray-200 flex justify-between items-center w-full">
                                                                <div className="text-sm text-green-700 font-medium flex items-center gap-1">
                                                                    <span>🏆</span>
                                                                    <div className="flex flex-col">
                                                                        <span>Global Lowest</span>
                                                                        <span className="text-xs font-bold">{lowest.regionName}</span>
                                                                    </div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="font-bold text-green-700 text-base">{lowest.original}</div>
                                                                    <div className="text-xs text-green-600/80">({formatPrice(lowest.hkd, 'HKD')})</div>
                                                                </div>
                                                            </div>
                                                        )}

                                                        <div className="w-full">
                                                            <table className="w-full text-left text-sm table-fixed">
                                                                <thead className="bg-gray-50 text-gray-600">
                                                                    <tr>
                                                                        <th className="px-4 py-3 font-medium border-b border-gray-200 w-[35%]">Region</th>
                                                                        <th className="px-2 py-3 font-medium text-right border-b border-gray-200 w-[35%]">Local Price</th>
                                                                        <th className="px-4 py-3 font-medium text-right border-b border-gray-200 w-[30%]">Est. HKD</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody className="divide-y divide-gray-100">
                                                                    {sortedPrices.map((p, i) => (
                                                                        <tr key={i} className="hover:bg-gray-50 active:bg-gray-100">
                                                                            <td className="px-4 py-3 text-gray-700 truncate">{p.regionName}</td>
                                                                            <td className="px-2 py-3 text-right text-gray-700 truncate">{p.original}</td>
                                                                            <td className="px-4 py-3 text-right font-mono text-gray-600 truncate">{formatPrice(p.hkd, 'HKD')}</td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
