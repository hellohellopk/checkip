<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceRadar App Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #f9fafb; margin: 0; padding: 0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-enter { animation: slideUp 0.2s ease-out forwards; }

        /* Region names: always reserve exactly two lines without increasing row height. */
        .region-cell-center {
            min-height: 1.61rem;
            height: 1.61rem;
            display: flex;
            align-items: center;
        }

        .hong-kong-row,
        .hong-kong-row td {
            background: #fff7cc !important;
        }

        .hong-kong-row {
            font-weight: 600;
            box-shadow: inset 3px 0 0 #f59e0b;
        }

        .region-name-2line {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            line-height: 0.805rem;
            height: 1.61rem;
            word-break: normal;
            overflow-wrap: anywhere;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans text-sm text-gray-800">
    <div id="root" class="w-full h-full"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const API = "https://api.priceradar.store";
        const APPLE_TOP_PAID_FEEDS = [
            "https://itunes.apple.com/us/rss/toppaidapplications/limit=25/json",
            "https://rss.marketingtools.apple.com/api/v2/us/apps/top-paid/25/apps.json"
        ];

        // CORS proxy fallbacks for Apple RSS. The target URL is encoded so
        // query-string parsing inside the proxy cannot corrupt the upstream URL.
        const CORS_PROXIES = [
            "https://round-morning-c112.nippon-eb8.workers.dev/?url=",
            "https://my-vercel-proxy-iota.vercel.app/api/proxy?url="
        ];
        const CURRENCY_SYMBOL = { USD: "$", CNY: "¥", HKD: "HK$", TWD: "NT$", JPY: "¥" };
        const ZERO_DECIMAL = { JPY: 1, KRW: 1, CLP: 1, IDR: 1, VND: 1 };
        
        function getRegionName(code) {
            if (!code) return "";
            const upperCode = code.toUpperCase();
            try {
                const regionName = new Intl.DisplayNames(['en'], { type: 'region' }).of(upperCode);
                return regionName || upperCode;
            } catch (e) {
                return upperCode;
            }
        }

        function toMajor(minorUnits, currency) {
            return ZERO_DECIMAL[currency] ? minorUnits : minorUnits / 100;
        }
        function formatPrice(value, currency) {
            const sym = CURRENCY_SYMBOL[currency] || currency + " ";
            const num = ZERO_DECIMAL[currency] ? Math.round(value) : Number(value).toFixed(2);
            return sym + num;
        }

        // Convert an API price into a major currency unit.
        // The API may return either minor units (e.g. cents) or a zero-decimal
        // currency. Keep this in one place so the table and lowest-price card
        // use exactly the same conversion.
        function getMajorPrice(price, currency) {
            const n = Number(price);
            if (!Number.isFinite(n)) return null;
            return ZERO_DECIMAL[currency] ? n : n / 100;
        }

        function getHkdValue(major, currency, rates) {
            if (!Number.isFinite(major) || currency === "HKD") return major;
            const fromRate = Number(rates?.[currency]);
            const hkdRate = Number(rates?.HKD);
            if (!(fromRate > 0) || !(hkdRate > 0)) return null;
            return (major / fromRate) * hkdRate;
        }
        function artworkUrl(url, size = 200) {
            if (!url) return "";
            if (url.includes("{w}x{h}{c}.{f}")) {
                return url.replace("{w}x{h}{c}.{f}", `${size}x${size}bb.jpg`);
            }
            return url;
        }

        function safeHttpsUrl(value) {
            if (!value) return "";
            try {
                const url = new URL(value, window.location.href);
                return url.protocol === "https:" ? url.href : "";
            } catch (e) {
                return "";
            }
        }

        function makeAbortError() {
            const err = new Error("Request cancelled");
            err.name = "AbortError";
            return err;
        }

        async function fetchJson(url, options = {}, timeoutMs = 15000) {
            const controller = options.signal ? null : new AbortController();
            const signal = options.signal || controller.signal;
            const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;

            try {
                const res = await fetch(url, { ...options, signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                if (timer) clearTimeout(timer);
            }
        }

        function App() {
            const [mode, setMode] = useState('deals');
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [loading, setLoading] = useState(false);
            const [rates, setRates] = useState({});
            
            const [selectedApp, setSelectedApp] = useState(null);
            const [appDetails, setAppDetails] = useState(null);
            const [detailLoading, setDetailLoading] = useState(false);
            // 新增 State 來控制目前選取的方案分頁
            const [activePlanIdx, setActivePlanIdx] = useState(0);
            const searchAbortRef = React.useRef(null);
            const detailAbortRef = React.useRef(null);

            useEffect(() => {
                const initData = async () => {
                    setLoading(true);
                    try {
                        const ratesPromise = fetch(`${API}/v1/rates`).catch(() => null);

                        // Apple RSS is requested through the user's CORS proxies.
                        // Try both proxies and both Apple feed endpoints so a
                        // temporary proxy/feed failure does not leave the home
                        // screen empty.
                        let dealsRes = null;
                        let dealsSource = "";

                        for (const feedUrl of APPLE_TOP_PAID_FEEDS) {
                            const proxiedUrls = CORS_PROXIES.map(
                                proxy => proxy + encodeURIComponent(feedUrl)
                            );

                            // Also try direct access last, in case the current
                            // browser/network already permits Apple's CORS headers.
                            proxiedUrls.push(feedUrl);

                            for (const requestUrl of proxiedUrls) {
                                try {
                                    const res = await fetch(requestUrl, {
                                        headers: { "Accept": "application/json" }
                                    });

                                    if (res.ok) {
                                        dealsRes = res;
                                        dealsSource = requestUrl;
                                        break;
                                    }

                                    console.warn(
                                        "Apple RSS request failed:",
                                        res.status,
                                        requestUrl
                                    );
                                } catch (feedError) {
                                    console.warn(
                                        "Apple RSS/proxy request failed:",
                                        requestUrl,
                                        feedError
                                    );
                                }
                            }

                            if (dealsRes) break;
                        }

                        if (!dealsRes) {
                            console.error("All Apple RSS/proxy requests failed.");
                        } else {
                            console.info("Apple Top Paid source:", dealsSource);
                        }

                        const ratesRes = await ratesPromise;
                        
                        if (ratesRes && ratesRes.ok) {
                            const rateData = await ratesRes.json();
                            if (rateData.code === 0) setRates(rateData.data.rates);
                        }
                        
                        if (dealsRes && dealsRes.ok) {
                            // Apple has two JSON RSS schemas:
                            // modern: feed.results[]
                            // legacy iTunes: feed.entry[]
                            const raw = await dealsRes.text();
                            let feedData;

                            try {
                                feedData = JSON.parse(raw);
                            } catch (parseError) {
                                console.error("Apple RSS returned invalid JSON:", raw.slice(0, 300));
                                throw new Error("Apple RSS returned invalid JSON");
                            }

                            const feed = feedData?.feed || {};

                            const entries = Array.isArray(feed.results)
                                ? feed.results.map(item => ({
                                    id: item?.id,
                                    name: item?.name,
                                    artistName: item?.artistName,
                                    artworkUrl100: item?.artworkUrl100,
                                    artworkUrl600: item?.artworkUrl600
                                }))
                                : Array.isArray(feed.entry)
                                    ? feed.entry.map(item => ({
                                        id: item?.["im:id"]?.label ||
                                            item?.id?.attributes?.["im:id"] ||
                                            item?.id?.label,
                                        name: item?.["im:name"]?.label,
                                        artistName: item?.["im:artist"]?.label,
                                        artworkUrl100: item?.["im:image"]?.[2]?.label ||
                                            item?.["im:image"]?.[0]?.label
                                    }))
                                    : [];

                            const formattedDeals = entries.map((app, index) => ({
                                id: `apple-rss-${app.id || index}`,
                                itunesId: app.id,
                                name: app.name || "Unknown",
                                developer: app.artistName || "",
                                iconUrl: artworkUrl(app.artworkUrl100 || app.artworkUrl600 || ""),
                                oldTier: null,
                                isDeal: true,
                                storeAppId: app.id
                            })).filter(app => app.storeAppId);

                            console.info(
                                `Apple Top Paid Apps loaded: ${formattedDeals.length}`,
                                feed.title || ""
                            );

                            setResults(formattedDeals);

                            if (!formattedDeals.length) {
                                console.warn("Apple Top Paid RSS returned no app results.", feedData);
                            }
                        }
                    } catch (e) {
                        console.error("Init error", e);
                    } finally {
                        setLoading(false);
                    }
                };
                initData();

                return () => {
                    if (searchAbortRef.current) searchAbortRef.current.abort();
                    if (detailAbortRef.current) detailAbortRef.current.abort();
                };
            }, []);

            const handleSearch = async (e) => {
                e.preventDefault();
                const q = query.trim();

                if (!q) {
                    if (searchAbortRef.current) searchAbortRef.current.abort();
                    setMode('deals');
                    setLoading(false);
                    return;
                }

                if (searchAbortRef.current) searchAbortRef.current.abort();
                const controller = new AbortController();
                searchAbortRef.current = controller;

                setMode('search');
                setLoading(true);
                setResults([]);

                try {
                    const data = await fetchJson(
                        `${API}/v1/apps/search?q=${encodeURIComponent(q)}&store=apple_app_store&country=us`,
                        { signal: controller.signal }
                    );

                    if (controller.signal.aborted) return;

                    if (data?.code === 0 && Array.isArray(data?.data)) {
                        const formatted = data.data.map(d => ({
                            id: d.id,
                            name: d.name || "Unknown",
                            developer: d.developer || "",
                            iconUrl: artworkUrl(d.icon_url || ""),
                            storeAppId: d.store_app_id
                        })).filter(d => d.id != null || d.storeAppId != null);

                        setResults(formatted);
                    } else {
                        console.error("Search API returned an unexpected payload:", data);
                        setResults([]);
                    }
                } catch (e) {
                    if (e?.name !== "AbortError") {
                        console.error("Search error", e);
                        setResults([]);
                    }
                } finally {
                    if (searchAbortRef.current === controller) {
                        searchAbortRef.current = null;
                        setLoading(false);
                    }
                }
            };

            const openDetails = async (app) => {
                if (detailAbortRef.current) detailAbortRef.current.abort();

                const controller = new AbortController();
                detailAbortRef.current = controller;

                setSelectedApp(app);
                setDetailLoading(true);
                setAppDetails(null);
                setActivePlanIdx(0);

                try {
                    let prId = app.id;

                    if (app.isDeal && app.itunesId) {
                        try {
                            const searchData = await fetchJson(
                                `${API}/v1/apps/search?q=${encodeURIComponent(app.name)}&store=apple_app_store&country=us`,
                                { signal: controller.signal }
                            );

                            const matched = Array.isArray(searchData?.data)
                                ? searchData.data.find(
                                    d => String(d.store_app_id) === String(app.itunesId)
                                )
                                : null;

                            if (matched?.id != null) prId = matched.id;
                        } catch (e) {
                            if (e?.name === "AbortError") throw e;
                            console.warn("Could not resolve deal App Store ID:", e);
                        }
                    }

                    if (prId == null) throw new Error("App ID is missing");

                    const encodedId = encodeURIComponent(String(prId));
                    const [pricesData, metaData] = await Promise.all([
                        fetchJson(`${API}/v1/apps/${encodedId}/prices`, { signal: controller.signal }),
                        fetchJson(`${API}/v1/apps/${encodedId}`, { signal: controller.signal })
                    ]);

                    if (controller.signal.aborted) return;

                    setAppDetails({
                        ...app,
                        meta: metaData?.code === 0 ? (metaData.data || {}) : {},
                        plans: pricesData?.code === 0 && Array.isArray(pricesData?.data?.plans)
                            ? pricesData.data.plans
                            : []
                    });
                } catch (e) {
                    if (e?.name === "AbortError") return;
                    console.error("Detail error", e);
                    setAppDetails({ error: "Failed to load prices. Please try again." });
                } finally {
                    if (detailAbortRef.current === controller) {
                        detailAbortRef.current = null;
                        setDetailLoading(false);
                    }
                }
            };

            // 過濾出有效的方案
            const validPlans = appDetails?.plans?.filter(
                p => Array.isArray(p?.prices) && p.prices.length > 0
            ) || [];

            // Keep the selected tab valid even if the API returns a different
            // number of plans than the previous app.
            const safePlanIdx = Math.min(
                Math.max(activePlanIdx, 0),
                Math.max(validPlans.length - 1, 0)
            );

            return (
                <div className="bg-white flex flex-col h-full w-full overflow-hidden relative">
                    {/* Header */}
                    <div className="bg-gray-100 px-4 py-3 flex items-center justify-between border-b border-gray-300 shrink-0 select-none w-full">
                        <div className="flex space-x-2">
                            <div className="w-3 h-3 rounded-full bg-red-400 shadow-inner"></div>
                            <div className="w-3 h-3 rounded-full bg-yellow-400 shadow-inner"></div>
                            <div className="w-3 h-3 rounded-full bg-green-400 shadow-inner"></div>
                        </div>
                        <div className="text-sm font-semibold text-gray-600">
                            {mode === 'deals' ? '🍎App Store' : '🔍 Search Results'}
                        </div>
                        <div className="w-10"></div>
                    </div>

                    {/* Toolbar */}
                    <div className="p-3 bg-gray-50 border-b border-gray-200 shrink-0 w-full">
                        <form onSubmit={handleSearch} className="flex gap-2 w-full">
                            <input 
                                type="text" 
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                placeholder="Search paid apps..."
                                className="flex-1 bg-white border border-gray-300 rounded-lg px-3 py-2 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow w-full"
                            />
                            <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors shrink-0">
                                Search
                            </button>
                        </form>
                    </div>

                    {/* Content List */}
                    <div className="flex-1 overflow-y-auto scrollbar-hide bg-white w-full">
                        {loading ? (
                            <div className="flex justify-center items-center h-40 text-blue-600 animate-pulse">Loading data...</div>
                        ) : (
                            <div className="flex flex-col w-full">
                                {results.map((app, idx) => (
                                    <div 
                                        key={idx} 
                                        onClick={() => openDetails(app)}
                                        className="bg-white hover:bg-gray-50 border-b border-gray-200 px-3 py-2.5 cursor-pointer transition-colors group flex items-center gap-3 w-full"
                                    >
                                        {app.iconUrl ? (
                                            <img src={app.iconUrl} className="w-9 h-9 rounded-lg border border-gray-100 object-cover shrink-0" alt="icon" />
                                        ) : (
                                            <div className="w-9 h-9 rounded-lg bg-gray-100 border border-gray-200 flex items-center justify-center text-base font-bold text-gray-500 shrink-0">
                                                {app.name.charAt(0)}
                                            </div>
                                        )}
                                        <div className="flex-1 min-w-0 flex flex-col justify-center">
                                            <div className="font-semibold text-gray-800 truncate group-hover:text-blue-600 transition-colors">{app.name}</div>
                                            <div className="text-gray-500 text-xs truncate mt-0.5">{app.developer}</div>
                                        </div>
                                        <div className="shrink-0">
                                            <span className="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full text-xs font-medium border border-blue-200 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                                Compare ›
                                            </span>
                                        </div>
                                    </div>
                                ))}
                                {!results.length && !loading && (
                                    <div className="text-center text-gray-500 mt-10">
                                        No Top Paid Apps found.<br />
                                        <span className="text-xs text-gray-400">Apple RSS / CORS proxy is unavailable.</span>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Detail Modal */}
                    {selectedApp && (
                        <div className="absolute inset-0 z-50 bg-white flex flex-col modal-enter overflow-hidden w-full h-full">
                            <div className="flex justify-between items-center px-3 py-2.5 border-b border-gray-200 bg-gray-50 shrink-0 w-full">
                                <div className="flex items-center gap-3">
                                    {selectedApp.iconUrl ? (
                                        <img src={selectedApp.iconUrl} className="w-9 h-9 rounded-lg border border-gray-200 shrink-0" alt="" />
                                    ) : (
                                        <div className="w-9 h-9 rounded-lg bg-gray-100 border border-gray-200 flex items-center justify-center font-bold text-gray-500 shrink-0">
                                            {(selectedApp.name || "?").charAt(0)}
                                        </div>
                                    )}
                                    <div className="flex-1 min-w-0 pr-4">
                                        <h3 className="font-bold text-base text-gray-800 truncate">{selectedApp.name}</h3>
                                        <p className="text-xs text-gray-500 truncate">{selectedApp.developer}</p>
                                    </div>
                                </div>
                                <button onClick={() => setSelectedApp(null)} className="p-2 bg-gray-200/50 hover:bg-gray-300 rounded-full text-gray-600 transition-colors shrink-0">
                                    ✕
                                </button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto bg-white p-0 w-full">
                                {detailLoading ? (
                                    <div className="text-center text-gray-500 animate-pulse py-10">Fetching global prices...</div>
                                ) : appDetails?.error ? (
                                    <div className="text-red-500 text-center py-10">{appDetails.error}</div>
                                ) : (
                                    <div className="flex flex-col w-full pb-8">
                                        {/* Store Link */}
                                        {safeHttpsUrl(appDetails?.meta?.store_url) && (
                                            <div className="flex justify-end p-4 border-b border-gray-100 bg-white w-full shrink-0">
                                                <a href={safeHttpsUrl(appDetails.meta.store_url)} target="_blank" rel="noopener noreferrer" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                                    Open in App Store ↗
                                                </a>
                                            </div>
                                        )}

                                        {!validPlans.length ? (
                                            <div className="p-6 text-center text-gray-500 w-full">
                                                No paid subscription plans available.
                                            </div>
                                        ) : (
                                            <>
                                                {/* 藥丸狀 (Pill-shaped) 標籤切換列 */}
                                                <div className="flex flex-wrap gap-2 p-4 w-full bg-gray-50/50 border-b border-gray-200 shrink-0">
                                                    {validPlans.map((plan, idx) => (
                                                        <button
                                                            key={idx}
                                                            onClick={() => setActivePlanIdx(idx)}
                                                            className={`px-4 py-2 rounded-full text-sm font-bold transition-all border ${
                                                                safePlanIdx === idx
                                                                    ? 'bg-violet-600 text-white border-violet-600 shadow-md'
                                                                    : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-100 shadow-sm'
                                                            }`}
                                                        >
                                                            {plan.name || plan.kind || 'Subscription'}
                                                        </button>
                                                    ))}
                                                </div>

                                                {/* 顯示目前選取的方案內容 */}
                                                {(() => {
                                                    const plan = validPlans[safePlanIdx];
                                                    if (!plan) return null;

                                                    const validPrices = plan.prices.filter(p => {
                                                        const major = getMajorPrice(p?.price, p?.currency);
                                                        return major != null && (
                                                            p.currency === "HKD" ||
                                                            (Number(rates?.[p.currency]) > 0 && Number(rates?.HKD) > 0)
                                                        );
                                                    });
                                                    const sortedPrices = validPrices.map(p => {
                                                        const major = getMajorPrice(p.price, p.currency);
                                                        const hkdValue = getHkdValue(major, p.currency, rates);
                                                        return {
                                                            regionCode: p.region_code,
                                                            regionName: getRegionName(p.region_code) || p.region_code || "Unknown",
                                                            original: formatPrice(major, p.currency),
                                                            hkd: hkdValue
                                                        };
                                                    }).filter(p => Number.isFinite(p.hkd) && p.hkd >= 0)
                                                      .sort((a, b) => a.hkd - b.hkd);

                                                    const lowest = sortedPrices[0];

                                                    return (
                                                        <div className="bg-white overflow-hidden w-full">
                                                            {lowest && (
                                                                <div className="p-4 bg-green-50/50 border-b border-gray-200 flex justify-between items-center w-full">
                                                                    <div className="text-sm text-green-700 font-medium flex items-center gap-1">
                                                                        <span>🏆</span>
                                                                        <div className="flex flex-col">
                                                                            <span>Global Lowest</span>
                                                                            <span className="text-xs font-bold">{lowest.regionName}</span>
                                                                        </div>
                                                                    </div>
                                                                    <div className="text-right">
                                                                        <div className="font-bold text-green-700 text-base">{lowest.original}</div>
                                                                        <div className="text-xs text-green-600/80">({formatPrice(lowest.hkd, 'HKD')})</div>
                                                                    </div>
                                                                </div>
                                                            )}

                                                            <div className="w-full">
                                                                <table className="w-full text-left text-sm table-fixed">
                                                                    <thead className="bg-gray-50 text-gray-600">
                                                                        <tr>
                                                                            <th className="px-4 py-3 font-medium border-b border-gray-200 w-[35%]">Region</th>
                                                                            <th className="px-2 py-3 font-medium text-right border-b border-gray-200 w-[35%]">Local Price</th>
                                                                            <th className="px-4 py-3 font-medium text-right border-b border-gray-200 w-[30%]">Est. HKD</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody className="divide-y divide-gray-100">
                                                                        {sortedPrices.map((p, i) => (
                                                                            <tr key={i} className={`hover:bg-gray-50 active:bg-gray-100 ${
                                                                                         String(p.regionCode || "").toUpperCase() === "HK" ||
                                                                                         String(p.regionName || "").toLowerCase() === "hong kong"
                                                                                             ? "hong-kong-row"
                                                                                             : ""
                                                                                     }`}>
                                                                                <td className="px-4 py-2 text-gray-700">
                                                                                    <div className="region-cell-center"><div className="region-name-2line" title={p.regionName}>{p.regionName}</div></div>
                                                                                </td>
                                                                                <td className="px-2 py-2 text-right text-gray-700 truncate">{p.original}</td>
                                                                                <td className="px-4 py-2 text-right font-mono text-gray-600 truncate">{formatPrice(p.hkd, 'HKD')}</td>
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </div>
                                                    );
                                                })()}
                                            </>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
