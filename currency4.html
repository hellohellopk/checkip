<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FX Terminal Pro - Auto Save</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Mono:wght@400;500;600&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --terminal-bg: #ffffff;
            --primary-green: #1b1f23;
            --accent-blue: #0366d6;
            --warn-yellow: #dbab09;
            --error-red: #d73a49;
            --text-gray: #586069;
            --border-color: #e8e8e8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            background: var(--bg-color);
            color: var(--primary-green);
            padding: 0;
            overflow-x: hidden;
        }

        .terminal-window {
            width: 100%;
            min-height: 100vh;
            background: var(--terminal-bg);
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background: #f6f6f6;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .terminal-buttons { display: flex; gap: 8px; margin-right: 16px; }
        .terminal-btn { width: 12px; height: 12px; border-radius: 50%; }
        .btn-red { background: var(--error-red); }
        .btn-yellow { background: #FFBD2E; }
        .btn-green { background: #27C93F; }
        .terminal-title { font-size: 13px; color: var(--text-gray); font-weight: 500; margin: 0 auto; }

        .terminal-body { padding: 0; flex: 1; }

        .header-content { padding: 16px 16px 8px 16px; }
        .update-time { font-size: 11px; color: #999; margin-bottom: 12px; }

        .controls {
            display: flex;
            gap: 8px;
            margin: 0 16px 16px 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 12px;
            border: 1px solid var(--primary-green);
            background: transparent;
            color: var(--primary-green);
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .btn.editing { background: var(--error-red); color: white; border-color: var(--error-red); }

        .api-selector {
            background: #f6f6f6;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
            flex: 1;
        }

        .currency-list-container { border-top: none; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; position: relative; }

        .currency-card {
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 8px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
            height: 40px;
            transition: background 0.2s, box-shadow 0.2s;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .currency-card.dragging {
            opacity: 0.85;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            z-index: 50;
            position: relative;
        }

        .currency-card.editing { padding-left: 68px; }

        .card-actions-left {
            position: absolute;
            left: 8px;
            display: none;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .currency-card.editing .card-actions-left { display: flex; }

        .drag-handle {
            color: rgba(0,0,0,0.55);
            font-size: 18px;
            cursor: grab;
            padding: 4px;
            touch-action: none;
            line-height: 1;
        }
        .drag-handle:active { cursor: grabbing; }

        .delete-btn {
            background: var(--error-red);
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            touch-action: none;
        }

        .flag-icon {
            width: 22px; height: 22px; border-radius: 50%;
            margin-right: 10px; overflow: hidden;
            border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0;
            position: relative; z-index: 1;
        }
        .flag-icon img { width: 100%; height: 100%; object-fit: cover; }

        .currency-info { flex: 1.2; min-width: 0; position: relative; z-index: 1; display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
        .currency-code { font-size: 17px; font-weight: bold; color: #000000; line-height: 1.2; flex-shrink: 0; }
        .currency-name { display: none; }

        .currency-watermark {
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            opacity: 0.45;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            pointer-events: none;
        }

        .currency-value { flex: 1.5; text-align: right; padding-left: 8px; display: flex; flex-direction: column; align-items: flex-end; position: relative; z-index: 1; }
        .amount-input {
            width: 100%; background: transparent; border: none; color: #000000;
            font-size: 17px; font-weight: bold; font-family: inherit; text-align: right; outline: none;
        }
        .rate { display: none; }

        /* Modals */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content { background: transparent; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .calc-container { width: 340px; background: #ffffff; padding: 24px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
        .calc-header { text-align: right; padding: 16px; background: #f6f6f6; border-radius: 12px;
            margin-bottom: 20px; border: 1px solid var(--border-color); height: 80px; display: flex; flex-direction: column; justify-content: flex-end; }
        .calc-display { font-size: 32px; color: var(--warn-yellow); font-weight: bold; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .calc-btn { background: #f6f6f6; border: 0; color: var(--primary-green); height: 60px; font-size: 20px; border-radius: 12px; cursor: pointer; }
        .calc-btn.op { color: var(--accent-blue); background: #eef4fc; }
        .calc-btn.done { background: #2ea44f; color: white; grid-column: span 2; }
        .currency-option { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; cursor: pointer; }
        .currency-option img { width: 32px; height: 32px; border-radius: 50%; margin-right: 12px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
<div class="terminal-window">
    <div class="terminal-header">
        <div class="terminal-buttons">
            <div class="terminal-btn btn-red"></div>
            <div class="terminal-btn btn-yellow"></div>
            <div class="terminal-btn btn-green"></div>
        </div>
        <div class="terminal-title">FX PRO TERMINAL</div>
    </div>
    <div class="terminal-body">
        <div class="header-content">
            <div class="update-time" id="update-time">數據同步中...</div>
        </div>
        <div class="controls">
            <button class="btn" id="edit-btn">Edit</button>
            <button class="btn" id="add-btn">+ Add</button>
            <select class="api-selector" id="api-selector">
                <option value="fxratesapi">FXRatesAPI (專業版)</option>
                <option value="exchangeratefree">ExchangeRate-API (免費)</option>
                <option value="exchangerate">ExchangeRate-API (V6)</option>
                <option value="openexchange">Open Exchange Rates</option>
            </select>
        </div>
        <div id="currency-list" class="currency-list-container"></div>
    </div>

    <div class="modal" id="calc-modal">
        <div class="modal-content">
            <div class="calc-container">
                <div id="calc-title" style="color:var(--primary-green);margin-bottom:10px;font-size:12px"></div>
                <div class="calc-header">
                    <div id="calc-expr" style="color:#999;font-size:14px;min-height:1.2em"></div>
                    <div class="calc-display" id="calc-display">0</div>
                </div>
                <div class="calc-grid">
                    <button class="calc-btn" style="color:var(--error-red)" onclick="calcAction('AC')">AC</button>
                    <button class="calc-btn" style="color:var(--error-red)" onclick="calcAction('DEL')">⌫</button>
                    <button class="calc-btn op" onclick="calcInput('/')">÷</button>
                    <button class="calc-btn op" onclick="calcInput('*')">×</button>
                    <button class="calc-btn" onclick="calcInput('7')">7</button>
                    <button class="calc-btn" onclick="calcInput('8')">8</button>
                    <button class="calc-btn" onclick="calcInput('9')">9</button>
                    <button class="calc-btn op" onclick="calcInput('-')">−</button>
                    <button class="calc-btn" onclick="calcInput('4')">4</button>
                    <button class="calc-btn" onclick="calcInput('5')">5</button>
                    <button class="calc-btn" onclick="calcInput('6')">6</button>
                    <button class="calc-btn op" onclick="calcInput('+')">+</button>
                    <button class="calc-btn" onclick="calcInput('1')">1</button>
                    <button class="calc-btn" onclick="calcInput('2')">2</button>
                    <button class="calc-btn" onclick="calcInput('3')">3</button>
                    <button class="calc-btn op" onclick="calcInput('.')">.</button>
                    <button class="calc-btn" onclick="calcInput('0')">0</button>
                    <button class="calc-btn" onclick="calcInput('00')">00</button>
                    <button class="calc-btn done" onclick="calcAction('DONE')">確認</button>
                </div>
                <button class="btn" style="margin-top:20px; border-color:var(--error-red); color:var(--error-red); width:100%; padding:15px; height:50px;" onclick="closeModal('calc-modal')">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-content" style="background:#ffffff">
            <div class="terminal-header" style="position:sticky; top:0;">
                <div class="terminal-title">Select Currency</div>
                <button class="btn" style="margin-left:auto; border-color:var(--error-red); color:var(--error-red);" id="modal-close">Close</button>
            </div>
            <div id="currency-options" style="overflow-y:auto; flex:1; width:100%"></div>
        </div>
    </div>
</div>

<script>
        const API_CONFIGS = {
            fxratesapi: { name: 'FXRatesAPI', key: 'fxr_live_38ad3c55b228cc844e71347bdb45cb3c63df', buildUrl: (key, codes) => `https://api.fxratesapi.com/latest?api_key=${key}&base=USD&currencies=${codes.join(',')}`, parseResponse: (data) => ({ success: data.success, rates: data.rates, timestamp: data.timestamp }) },
            exchangeratefree: { name: 'ExchangeRate-API (Free)', key: '', buildUrl: (key, codes) => `https://api.exchangerate-api.com/v4/latest/USD`, parseResponse: (data) => ({ success: true, rates: data.rates, timestamp: data.time_last_updated }) },
            exchangerate: { name: 'ExchangeRate-API', key: '0d5edd3dbe453790b0bcc4d6', buildUrl: (key, codes) => `https://v6.exchangerate-api.com/v6/${key}/latest/USD`, parseResponse: (data) => ({ success: data.result === 'success', rates: data.conversion_rates, timestamp: data.time_last_update_unix }) },
            openexchange: { name: 'Open Exchange Rates', key: '219fb31cd84b49acb19edb3cb5e7cdfd', buildUrl: (key, codes) => `https://openexchangerates.org/api/latest.json?app_id=${key}`, parseResponse: (data) => ({ success: true, rates: data.rates, timestamp: data.timestamp }) }
        };

        const allCurrencyInfo = {
            HKD: { name: 'Hong Kong Dollar', code: 'hk', symbol: 'HK$' },
            USD: { name: 'United States Dollar', code: 'us', symbol: '$' },
            EUR: { name: 'Euro', code: 'eu', symbol: '€' },
            JPY: { name: 'Japanese Yen', code: 'jp', symbol: '¥' },
            GBP: { name: 'British Pound', code: 'gb', symbol: '£' },
            CNY: { name: 'Chinese Yuan', code: 'cn', symbol: '¥' },
            AUD: { name: 'Australian Dollar', code: 'au', symbol: 'A$' },
            CAD: { name: 'Canadian Dollar', code: 'ca', symbol: 'C$' },
            CHF: { name: 'Swiss Franc', code: 'ch', symbol: 'CHF' },
            SGD: { name: 'Singapore Dollar', code: 'sg', symbol: 'S$' },
            SEK: { name: 'Swedish Krona', code: 'se', symbol: 'kr' },
            KRW: { name: 'South Korean Won', code: 'kr', symbol: '₩' },
            NOK: { name: 'Norwegian Krone', code: 'no', symbol: 'kr' },
            NZD: { name: 'New Zealand Dollar', code: 'nz', symbol: 'NZ$' },
            INR: { name: 'Indian Rupee', code: 'in', symbol: '₹' },
            MXN: { name: 'Mexican Peso', code: 'mx', symbol: 'MX$' },
            TWD: { name: 'New Taiwan Dollar', code: 'tw', symbol: 'NT$' },
            ZAR: { name: 'South African Rand', code: 'za', symbol: 'R' },
            BRL: { name: 'Brazilian Real', code: 'br', symbol: 'R$' },
            THB: { name: 'Thai Baht', code: 'th', symbol: '฿' },
            TRY: { name: 'Turkish Lira', code: 'tr', symbol: '₺' },
            NGN: { name: 'Nigerian Naira', code: 'ng', symbol: '₦' },
            PHP: { name: 'Philippine Peso', code: 'ph', symbol: '₱' },
            VND: { name: 'Vietnamese Dong', code: 'vn', symbol: '₫' },
            IDR: { name: 'Indonesian Rupiah', code: 'id', symbol: 'Rp' },
            MYR: { name: 'Malaysian Ringgit', code: 'my', symbol: 'RM' },
            RUB: { name: 'Russian Ruble', code: 'ru', symbol: '₽' }
        };

        // Vivid pastel palette - 20 distinct saturated hues, one per currency (hash-assigned)
        const CARD_COLORS = [
            { h: 142, s: 68 }, { h: 4,   s: 78 }, { h: 38,  s: 92 }, { h: 199, s: 75 },
            { h: 328, s: 70 }, { h: 262, s: 65 }, { h: 22,  s: 85 }, { h: 168, s: 60 },
            { h: 352, s: 75 }, { h: 88,  s: 55 }, { h: 214, s: 70 }, { h: 14,  s: 80 },
            { h: 55,  s: 85 }, { h: 285, s: 60 }, { h: 180, s: 55 }, { h: 305, s: 65 },
            { h: 122, s: 60 }, { h: 240, s: 65 }, { h: 65,  s: 70 }, { h: 8,   s: 70 }
        ];
        function getCardColor(code) {
            let hash = 0;
            for (let i = 0; i < code.length; i++) hash = (hash * 31 + code.charCodeAt(i)) % CARD_COLORS.length;
            const c = CARD_COLORS[Math.abs(hash) % CARD_COLORS.length];
            return {
                bg: `hsl(${c.h}, ${c.s}%, 62%)`,
                border: `hsl(${c.h}, ${c.s}%, 42%)`,
                watermark: `hsl(${c.h}, ${c.s}%, 15%)`
            };
        }

        const defaultCurrencies = ['HKD', 'USD', 'EUR', 'JPY', 'GBP', 'CNY', 'AUD', 'CAD', 'CHF', 'SGD', 'SEK', 'KRW', 'NOK', 'NZD', 'INR', 'MXN', 'TWD', 'ZAR', 'BRL', 'THB'];

        let displayedCurrencies = JSON.parse(localStorage.getItem('fx_terminal_list')) || [...defaultCurrencies];

        let currentRates = null;
        let ratesVsHKD = null;
        let currentBaseHKD = 1000;
        let isEditMode = false;
        let calcVal = "0";
        let calcTarget = "HKD";

        function saveSettings() {
            localStorage.setItem('fx_terminal_list', JSON.stringify(displayedCurrencies));
        }

        async function fetchRates(apiType) {
            const config = API_CONFIGS[apiType];
            try {
                const response = await fetch(config.buildUrl(config.key, Object.keys(allCurrencyInfo)));
                const data = await response.json();
                const parsed = config.parseResponse(data);
                document.getElementById('update-time').textContent = `${config.name} | Last updated: ${new Date(parsed.timestamp * 1000).toLocaleString()}`;
                currentRates = parsed.rates;
                const hkdPerUsd = currentRates['HKD'];
                ratesVsHKD = {};
                for (const code in currentRates) {
                    ratesVsHKD[code] = currentRates[code] / hkdPerUsd;
                }
                ratesVsHKD['HKD'] = 1;
                return ratesVsHKD;
            } catch (error) {
                document.getElementById('update-time').textContent = 'ERROR: Failed to load rates';
                return null;
            }
        }

        function formatNumberWithCommas(num, decimals = 2) {
            const parts = num.toFixed(decimals).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        function renderCurrencies() {
            const listElement = document.getElementById('currency-list');
            listElement.innerHTML = '';

            displayedCurrencies.forEach((code) => {
                const info = allCurrencyInfo[code];
                if (!info || !ratesVsHKD[code]) return;

                const amount = currentBaseHKD * ratesVsHKD[code];
                const isFixed = defaultCurrencies.slice(0, 1).includes(code);

                const card = document.createElement('div');
                card.className = 'currency-card';
                card.dataset.code = code;
                if (isEditMode) card.classList.add('editing');

                const cardColor = getCardColor(code);
                card.style.background = cardColor.bg;
                card.style.borderColor = cardColor.border;

                card.innerHTML = `
                    <div class="card-actions-left">
                        <span class="drag-handle">⠿</span>
                        ${!isFixed ? `<button class="delete-btn" data-code="${code}">×</button>` : ''}
                    </div>
                    <div class="flag-icon">
                        <img src="https://flagcdn.com/w160/${info.code}.png" alt="${code}" />
                    </div>
                    <div class="currency-info">
                        <div class="currency-code">${code}</div>
                        <div class="currency-watermark" style="color:${cardColor.watermark}">${info.name}</div>
                    </div>
                    <div class="currency-value">
                        <input type="text" id="input-${code}" class="amount-input"
                               value="${info.symbol} ${formatNumberWithCommas(amount)}" readonly />
                    </div>
                `;

                const handle = card.querySelector('.drag-handle');
                if (handle) {
                    const dragStartHandler = (e) => {
                        if (!isEditMode) return;
                        e.preventDefault();
                        e.stopPropagation();
                        startManualDrag(card, e);
                    };
                    handle.addEventListener('touchstart', dragStartHandler, { passive: false });
                    handle.addEventListener('mousedown', dragStartHandler);
                }

                const delBtn = card.querySelector('.delete-btn');
                if (delBtn) {
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        displayedCurrencies = displayedCurrencies.filter(c => c !== code);
                        saveSettings();
                        renderCurrencies();
                    };
                }

                const input = card.querySelector('.amount-input');
                input.onclick = (e) => {
                    if (isEditMode) return;
                    e.stopPropagation();
                    openCalc(code, parseFloat(input.value.replace(/[^0-9.-]+/g,"")) || 0);
                };

                listElement.appendChild(card);
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.currency-card:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function startManualDrag(card, startEvent) {
            const listElement = document.getElementById('currency-list');
            const isTouch = startEvent.type === 'touchstart';
            let startY = isTouch ? startEvent.touches[0].clientY : startEvent.clientY;
            const cardRect = card.getBoundingClientRect();
            const offsetInCard = startY - cardRect.top;

            const placeholder = document.createElement('div');
            placeholder.style.height = cardRect.height + 'px';
            placeholder.style.flexShrink = '0';

            card.classList.add('dragging');
            card.style.position = 'fixed';
            card.style.left = cardRect.left + 'px';
            card.style.width = cardRect.width + 'px';
            card.style.top = cardRect.top + 'px';
            card.style.pointerEvents = 'none';
            listElement.insertBefore(placeholder, card.nextSibling);

            function moveTo(clientY) {
                card.style.top = (clientY - offsetInCard) + 'px';
                const afterElement = getDragAfterElement(listElement, clientY);
                if (afterElement == null) {
                    listElement.appendChild(placeholder);
                } else if (afterElement !== placeholder) {
                    listElement.insertBefore(placeholder, afterElement);
                }
            }

            function onMove(e) {
                e.preventDefault();
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                moveTo(clientY);
            }

            function endDrag() {
                card.classList.remove('dragging');
                card.style.position = '';
                card.style.left = '';
                card.style.width = '';
                card.style.top = '';
                card.style.pointerEvents = '';
                listElement.insertBefore(card, placeholder);
                placeholder.remove();

                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', endDrag);
                document.removeEventListener('pointercancel', endDrag);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', endDrag);
                document.removeEventListener('touchcancel', endDrag);
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', endDrag);

                displayedCurrencies = [...document.querySelectorAll('.currency-card')].map(c => c.dataset.code);
                saveSettings();
            }

            if (isTouch) {
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', endDrag);
                document.addEventListener('touchcancel', endDrag);
            } else if (startEvent.type === 'mousedown') {
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', endDrag);
            } else {
                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', endDrag);
                document.addEventListener('pointercancel', endDrag);
            }
        }

        function updateAllAmounts(changedCode, changedAmount) {
            currentBaseHKD = changedAmount / ratesVsHKD[changedCode];
            displayedCurrencies.forEach(code => {
                const input = document.getElementById(`input-${code}`);
                if (input) {
                    input.value = `${allCurrencyInfo[code].symbol} ${formatNumberWithCommas(currentBaseHKD * ratesVsHKD[code])}`;
                }
            });
        }

        function openCalc(code, val) {
            calcTarget = code;
            calcVal = val.toString();
            document.getElementById('calc-title').textContent = code;
            updateCalc();
            document.getElementById('calc-modal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function calcInput(v) {
            if (calcVal === "0" && v !== '.') calcVal = v;
            else calcVal += v;
            updateCalc();
        }

        function calcAction(a) {
            if (a === 'AC') { calcVal = "0"; }
            else if (a === 'DEL') { calcVal = calcVal.length > 1 ? calcVal.slice(0, -1) : "0"; }
            else if (a === 'DONE') {
                try {
                    const result = Function(`return ${calcVal.replace(/×/g, '*').replace(/÷/g, '/')}`)();
                    if (isFinite(result)) {
                        updateAllAmounts(calcTarget, result);
                        closeModal('calc-modal');
                    } else { calcVal = "Error"; }
                } catch (e) { calcVal = "Error"; }
                updateCalc();
                setTimeout(() => { calcVal = "0"; updateCalc(); }, 500);
                return;
            }
            updateCalc();
        }

        function updateCalc() {
            document.getElementById('calc-display').textContent = calcVal;
            const expr = calcVal.replace(/×/g, '*').replace(/÷/g, '/');
            if (/[+\-*/]/.test(expr)) {
                try {
                    const preview = Function(`return ${expr}`)();
                    document.getElementById('calc-expr').textContent = isNaN(preview) ? '' : preview.toLocaleString();
                } catch (e) { document.getElementById('calc-expr').textContent = ''; }
            } else {
                document.getElementById('calc-expr').textContent = '';
            }
        }

        document.getElementById('edit-btn').onclick = () => {
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-btn');
            btn.textContent = isEditMode ? 'Done' : 'Edit';
            btn.classList.toggle('editing');
            renderCurrencies();
        };

        document.getElementById('add-btn').onclick = () => {
            const modal = document.getElementById('add-modal');
            const container = document.getElementById('currency-options');
            container.innerHTML = '';
            Object.keys(allCurrencyInfo).forEach(code => {
                if (!displayedCurrencies.includes(code) && ratesVsHKD[code]) {
                    const option = document.createElement('div');
                    option.className = 'currency-option';
                    option.innerHTML = `
                        <img src="https://flagcdn.com/w80/${allCurrencyInfo[code].code}.png" />
                        <div><div style="font-weight:bold;color:#1b1f23">${code}</div><div style="font-size:12px;color:#999">${allCurrencyInfo[code].name}</div></div>
                    `;
                    option.onclick = () => {
                        displayedCurrencies.push(code);
                        saveSettings();
                        modal.classList.remove('active');
                        renderCurrencies();
                    };
                    container.appendChild(option);
                }
            });
            modal.classList.add('active');
        };

        document.getElementById('modal-close').onclick = () => closeModal('add-modal');
        document.getElementById('api-selector').onchange = () => initialize();

        async function initialize() {
            const rates = await fetchRates(document.getElementById('api-selector').value);
            if (rates) renderCurrencies();
        }

        initialize();
</script>
</body>
</html>
